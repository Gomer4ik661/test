# Сюжет квеста. Редактируйте смело: проверка — `python validate.py`.
#
# Сцена:
#   text:    текст (можно <b>жирный</b>, <i>курсив</i>; символы < > & пишите как &lt; &gt; &amp;)
#   choices: список вариантов
#   ending:  "Название" — делает сцену концовкой (варианты тогда не нужны)
#
# Вариант выбора:
#   text:   надпись на кнопке (коротко, до ~40 символов)
#   goto:   id следующей сцены
#   need:   [флаги] — кнопка видна, только если у игрока есть ВСЕ эти флаги
#   unless: [флаги] — кнопка скрыта, если есть ХОТЯ БЫ один
#   give:   [флаги] — выдать (предметы, знания)
#   take:   [флаги] — забрать

title: Письмо от бабушки
start: intro

scenes:
  intro:
    text: |
      Письмо пришло во вторник. Знакомый наклонный почерк, запах лаванды:
      <i>«Внучек, приезжай. Мне страшно одной. Он снова ходит под полом».</i>

      Бабушка умерла год назад. Ты сам нёс её гроб.

      Сейчас почти полночь. Такси уехало, и ты стоишь перед её домом на краю деревни. В окне второго этажа горит свеча.
    choices:
      - text: Подойти к дому
        goto: porch
      - text: Вызвать такси обратно
        goto: end_flee

  porch:
    text: |
      Крыльцо скрипит под ногами. Дверь приоткрыта, изнутри тянет воском и сырой землёй.

      Где-то в глубине дома тикают часы. Тик. Тик. И замолкают.
    choices:
      - text: Войти в дом
        goto: hall
      - text: Обойти двор
        goto: yard

  yard:
    text: |
      Двор зарос крапивой по пояс. В лунном свете чернеет старый колодец, у забора кособокий сарай.

      Тебе кажется, что из колодца доносится тихое пение. Бабушкина колыбельная.
    choices:
      - text: Подойти к колодцу
        goto: well
      - text: Заглянуть в сарай
        goto: shed
      - text: Вернуться к крыльцу
        goto: porch

  well:
    text: |
      Из глубины колодца пахнет тиной. Пение обрывается.

      — Внучек… — шепчет голос снизу. — Я упала. Помоги мне. Наклонись поближе, я не достаю…
    choices:
      - text: Наклониться ниже
        goto: end_well
      - text: Медленно отойти
        goto: yard

  shed:
    text: |
      В сарае пахнет керосином. На верстаке лежат огарок толстой церковной свечи и коробок спичек.

      На стене углём нацарапано: <b>НЕ ХОДИ ВНИЗ БЕЗ СВЕТА</b>.
    choices:
      - text: Забрать свечу и спички
        goto: yard
        unless: [candle]
        give: [candle]
      - text: Вернуться во двор
        goto: yard

  hall:
    text: |
      В прихожей темно. Часы на стене остановились на 3:17, на этом времени бабушка и умерла.
      Зеркало завешено чёрной тканью.

      Отсюда можно пройти на кухню или в спальню. В конце коридора низкая дверь в подвал. Из-под неё тянет холодом.
    choices:
      - text: Пойти на кухню
        goto: kitchen
      - text: Пойти в спальню
        goto: bedroom
      - text: Приподнять ткань с зеркала
        goto: mirror
        unless: [mirror_seen]
      - text: Открыть дверь в подвал
        goto: basement_door
      - text: Выйти во двор
        goto: yard

  mirror:
    text: |
      Ты стягиваешь ткань. В зеркале ты, бледный и уставший.

      Ты моргаешь. Отражение моргает на полсекунды позже.
    choices:
      - text: Всмотреться
        goto: mirror_long
      - text: Набросить ткань обратно
        goto: hall
        give: [mirror_seen]

  mirror_long:
    text: |
      Отражение медленно улыбается, хотя ты не улыбаешься. Его губы шевелятся:

      <i>«Он боится своего имени. Она записала его имя. Ищи то, что заперто».</i>

      Стекло покрывается инеем, и отражение исчезает.
    choices:
      - text: Вернуться в коридор
        goto: hall
        give: [mirror_seen]

  kitchen:
    text: |
      Стол накрыт на двоих. В чашках чай, и от него ещё идёт пар.

      Под сахарницей записка: <i>«Ключ там же, где мы прятали конфеты от деда»</i>.
    choices:
      - text: Проверить жестяную банку на полке
        goto: kitchen_jar
        unless: [key]
      - text: Отпить чаю
        goto: kitchen_tea
        unless: [tea]
      - text: Вернуться в коридор
        goto: hall

  kitchen_jar:
    text: |
      Банка из-под монпансье, как в детстве. Внутри вместо конфет лежит маленький латунный ключ.

      Ты слышишь, как за спиной отодвигается стул. Оборачиваешься, но никого нет.
    choices:
      - text: Забрать ключ
        goto: kitchen
        give: [key]

  kitchen_tea:
    text: |
      Чай горький, с полынью. Кухня плывёт перед глазами…

      …и ты видишь бабушку. Она сидит напротив, и она очень испугана.
      <i>«Я его впустила, чтобы спасти тебя, когда ты болел. Он взял плату и не ушёл. Не отдавай ему дом».</i>

      Видение тает.
    choices:
      - text: Прийти в себя
        goto: kitchen
        give: [tea]

  bedroom:
    text: |
      В спальне идеальный порядок, будто здесь только что убрали. На тумбочке лежит открытый фотоальбом.
      В углу стоит сундук с навесным замком.
    choices:
      - text: Взять фото из альбома
        goto: bedroom_photo
        unless: [photo]
      - text: Открыть сундук ключом
        goto: chest
        need: [key]
        unless: [diary]
      - text: Вернуться в коридор
        goto: hall

  bedroom_photo:
    text: |
      На фотографии бабушка, совсем молодая, а рядом с ней высокий худой мужчина. Его лицо аккуратно выцарапано иглой.

      На обороте надпись: <i>«Июнь 1961. Мы с А. на сенокосе»</i>.
    choices:
      - text: Положить фото в карман
        goto: bedroom
        give: [photo]

  chest:
    text: |
      Замок щёлкает. В сундуке лежит бабушкин дневник. Последняя запись:

      <i>«Он был человеком, пока не утонул в колодце. Звали его Аким. Он злится, что его забыли.
      Если найдётся смелый: при свете свечи назови его по имени и покажи ему, каким он был. Тогда он уйдёт».</i>
    choices:
      - text: Забрать дневник
        goto: bedroom
        give: [diary]

  basement_door:
    text: |
      За дверью вниз уходят крутые ступени. Темнота такая плотная, что кажется жидкой.

      Снизу доносится бабушкин голос: <i>«Внучек? Это ты? Спускайся…»</i>
    choices:
      - text: Зажечь свечу и спуститься
        goto: basement
        need: [candle]
      - text: Спуститься в темноте
        goto: end_house
        unless: [candle]
      - text: Закрыть дверь
        goto: hall

  basement:
    text: |
      Пламя свечи дрожит. В дальнем углу подвала стоит высокая худая фигура, мокрая, будто только что из воды.
      Вместо лица у неё серое пятно.

      Говорит она бабушкиным голосом:
      <i>«Останься. Дому нужен хозяин. Я дам тебе всё, что захочешь. Деньги. Время. Её голос, когда станет одиноко»</i>.
    choices:
      - text: Назвать его по имени
        goto: basement_name
        need: [diary]
      - text: Принять предложение
        goto: end_deal
      - text: Броситься на него
        goto: end_house
      - text: Бежать наверх
        goto: flee_up

  basement_name:
    text: |
      — <b>Аким</b>, — говоришь ты.

      Фигура вздрагивает. Серое пятно на месте лица идёт рябью, и на миг под ним проступают человеческие черты.
      — Откуда… — хрипит он. Голос уже не бабушкин, а его собственный.
    choices:
      - text: Показать ему фотографию
        goto: end_peace
        need: [photo]
      - text: Бежать, пока он ослаб
        goto: end_flee
      - text: Предложить сделку
        goto: end_deal

  flee_up:
    text: |
      Ты взлетаешь по ступеням, и дверь сама захлопывается у тебя за спиной.

      Коридор стал длиннее. Намного длиннее. Часы на стене снова тикают, только назад.
    choices:
      - text: Разбить окно и выпрыгнуть
        goto: end_flee
      - text: Вернуться в подвал
        goto: basement
        need: [candle]

  # ───────────── Концовки ─────────────

  end_flee:
    ending: Беглец
    text: |
      Ты бежишь, не оглядываясь, до самой трассы. Утром тебя подбирает грузовик.

      Ты продаёшь квартиру и переезжаешь в другой город. Но каждый вторник в почтовом ящике лежит письмо с запахом лаванды:
      <i>«Внучек, почему ты ушёл?»</i>

  end_well:
    ending: Голос из колодца
    text: |
      Ты наклоняешься ниже. Ещё ниже.

      Холодные мокрые пальцы смыкаются у тебя на запястье, и пение возобновляется. Теперь вы поёте вдвоём.

  end_house:
    ending: Часть дома
    text: |
      Что-то тянется к тебе из темноты, и половицы под ногами становятся мягкими, как торф.

      Утром соседка увидит, что в доме опять горит свеча. Теперь в двух окнах.

  end_deal:
    ending: Новый хозяин
    text: |
      — Согласен, — говоришь ты.

      Фигура кланяется и растворяется у тебя в тени. Дела у тебя идут прекрасно: деньги, удача, долгая жизнь.
      Только иногда по ночам ты слышишь, как кто-то ходит у тебя под полом.

      Недавно ты написал письмо своему внуку.

  end_peace:
    ending: Упокоение
    text: |
      Ты протягиваешь фотографию. Аким долго смотрит на молодого себя рядом с девушкой на сенокосе.

      — Я помню, — тихо говорит он. — Было лето…

      Вода стекает с него, а следом уходит и тьма. Остаётся просто старик, который кивает тебе и исчезает.

      Наверху снова тикают часы, и на этот раз вперёд. На кухне остывают две чашки чая.
      Писем больше не приходит.
